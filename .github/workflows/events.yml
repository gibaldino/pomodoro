name: Atualizar agenda
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install icalendar recurring_ical_events
      - run: python build_events.py
        env: {ICAL_URL: "${{ secrets.ICAL_URL }}"}
      - run: |
          git config user.name "pomodoro-bot"; git config user.email "actions@users.noreply.github.com"
          git add events.json; git commit -m "agenda" || exit 0; git push
